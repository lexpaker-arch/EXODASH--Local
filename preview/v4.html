<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>V4 Metalico</title>
<style>
body { background: #0d0d0d; font-family: Roboto; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
.screen {
  width: 900px; height: 520px;
  background: linear-gradient(135deg, #2a2a2a 0%, #1a1a1a 30%, #0d0d0d 70%, #222 100%);
  border: 3px solid #8a8a8a; border-radius: 6px; padding: 10px;
  position: relative; overflow: hidden;
  box-shadow: inset 0 0 100px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.15);
}
.moldura {
  width: 100%; height: 100%;
  border: 1px solid rgba(180,180,180,0.4);
  border-radius: 4px; padding: 14px;
  display: flex; flex-direction: column;
  background: linear-gradient(180deg, rgba(255,255,255,0.03) 0%, transparent 40%);
}
.header { display: flex; justify-content: space-between; padding-bottom: 8px; }
.logo { color: #d0d0d0; font-size: 18px; font-weight: bold; letter-spacing: 3px; text-shadow: 0 0 10px rgba(255,255,255,0.3); }
.by { color: #777; font-size: 9px; letter-spacing: 2px; margin-top: 2px; }
.status { display: flex; gap: 14px; font-size: 10px; align-items: center; }
.st { color: #999; } .ok { color: #00FFCC; } .warn { color: #FFAA00; } .off { color: #FF4444; }
.cfg { width: 32px; height: 32px; border-radius: 50%; border: 2px solid #666; background: linear-gradient(180deg, #3a3a3a, #1a1a1a); display: flex; align-items: center; justify-content: center; color: #00FFCC; font-size: 16px; margin-left: 8px; box-shadow: inset 0 1px 0 rgba(255,255,255,0.2); }
.div { height: 1px; background: linear-gradient(90deg, transparent, #ccc, transparent); opacity: 0.5; margin-bottom: 12px; }
.central { flex: 1; display: flex; gap: 12px; align-items: stretch; }
.card {
  background: linear-gradient(180deg, #2e2e2e 0%, #1a1a1a 100%);
  border: 1px solid #4a4a4a; border-radius: 8px; padding: 12px;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.12), 0 2px 8px rgba(0,0,0,0.6);
}
.tele { flex: 1; }
.tel-linha { display: flex; justify-content: space-between; align-items: baseline; padding-bottom: 8px; margin-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.06); }
.tel-linha:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }
.tel-label { color: #aaa; font-size: 9px; letter-spacing: 2px; }
.tel-valor { color: #00FFCC; font-size: 15px; font-weight: bold; text-shadow: 0 0 10px rgba(0,255,204,0.6); }
.boss-area { display: flex; align-items: center; justify-content: center; position: relative; width: 180px; }
.brilho { position: absolute; width: 180px; height: 180px; border-radius: 50%; background: radial-gradient(circle, rgba(0,255,204,0.4) 0%, transparent 70%); }
.anel { position: absolute; width: 160px; height: 160px; border-radius: 50%; border: 2px solid rgba(0,255,204,0.5); animation: gira 20s linear infinite; }
@keyframes gira { to { transform: rotate(360deg); } }
.boss-btn {
  position: relative; width: 120px; height: 120px; border-radius: 50%;
  background: radial-gradient(circle at 30% 30%, #3a3a3a, #0a0a0a 70%);
  border: 3px solid #00FFCC;
  display: flex; align-items: center; justify-content: center;
  color: #00FFCC; font-size: 16px; font-weight: bold; letter-spacing: 4px;
  box-shadow: 0 0 40px rgba(0,255,204,0.5), inset 0 0 30px rgba(0,255,204,0.15), inset 0 2px 0 rgba(255,255,255,0.15);
}
.dir { flex: 1; display: flex; flex-direction: column; gap: 10px; }
.rel-ring { width: 90px; height: 90px; border-radius: 50%; border: 1px solid rgba(0,255,204,0.3); background: radial-gradient(circle at 30% 30%, #2a2a2a, #0a0a0a 70%); display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 0 auto; box-shadow: inset 0 2px 0 rgba(255,255,255,0.1); }
.rel-h { color: #E8E8E8; font-size: 22px; font-weight: 100; }
.rel-l { width: 40px; height: 1px; background: rgba(0,255,204,0.3); margin: 3px 0; }
.rel-s { color: #00FFCC; font-size: 9px; }
.rel-d { color: #888; font-size: 8px; letter-spacing: 3px; margin-top: 6px; text-align: center; text-transform: uppercase; }
.rel-dia { color: #00FFCC; font-size: 9px; text-align: center; }
.mus { background: linear-gradient(180deg, #2e2e2e 0%, #1a1a1a 100%); border: 1px solid #4a4a4a; border-radius: 8px; padding: 10px; box-shadow: inset 0 1px 0 rgba(255,255,255,0.12); }
.mus-l { color: #00FFCC; font-size: 7px; letter-spacing: 2px; }
.mus-t { color: #E8E8E8; font-size: 10px; font-weight: bold; margin-top: 4px; }
.mus-a { color: #999; font-size: 8px; }
.rodape { display: flex; justify-content: center; gap: 24px; padding-top: 12px; }
.at { display: flex; flex-direction: column; align-items: center; gap: 3px; }
.at-i { width: 46px; height: 46px; border-radius: 50%; border: 2px solid #555; background: linear-gradient(180deg, #3a3a3a, #0a0a0a); display: flex; align-items: center; justify-content: center; box-shadow: inset 0 2px 0 rgba(255,255,255,0.15); }
.at-i svg { width: 24px; height: 24px; } .at-i svg path { fill: #00FFCC; }
.at-n { color: #888; font-size: 8px; }
.nota { position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%); color: #666; font-size: 11px; }
</style></head>
<body>
<div class="screen">
  <div class="moldura">
    <div class="header">
      <div><div class="logo">EXODASH</div><div class="by">BY ALEX. P</div></div>
      <div class="status">
        <span class="st">EXODASH: <span class="warn">OFFLINE</span></span>
        <span class="st">OBD: <span class="off">OFFLINE</span></span>
        <span class="st">USUARIO: <span class="ok">SENHOR</span></span>
        <div class="cfg">&#9881;</div>
      </div>
    </div>
    <div class="div"></div>
    <div class="central">
      <div class="card tele">
        <div class="tel-linha"><span class="tel-label">VELOCIDADE</span><span class="tel-valor">87 km/h</span></div>
        <div class="tel-linha"><span class="tel-label">RPM</span><span class="tel-valor">2450</span></div>
        <div class="tel-linha"><span class="tel-label">MOTOR</span><span class="tel-valor">89 C</span></div>
        <div class="tel-linha"><span class="tel-label">COMBUSTIVEL</span><span class="tel-valor">62 %</span></div>
        <div class="tel-linha"><span class="tel-label">BATERIA</span><span class="tel-valor">13.8 V</span></div>
      </div>
      <div class="boss-area">
        <div class="brilho"></div><div class="anel"></div>
        <div class="boss-btn">EXO</div>
      </div>
      <div class="card dir">
        <div class="rel-ring"><div class="rel-h">14:32</div><div class="rel-l"></div><div class="rel-s">:47</div></div>
        <div class="rel-d">23 DE SETEMBRO</div>
        <div class="rel-dia">QUARTA-FEIRA</div>
        <div class="mus">
          <div class="mus-l">TOCANDO AGORA</div>
          <div class="mus-t">Bohemian Rhapsody</div>
          <div class="mus-a">Queen</div>
        </div>
      </div>
    </div>
    <div class="rodape">
      <div class="at"><div class="at-i"><svg viewBox="0 0 24 24"><path d="M6.62,10.79c1.44,2.83 3.76,5.14 6.59,6.59l2.2,-2.2c0.27,-0.27 0.67,-0.36 1.02,-0.24 1.12,0.37 2.33,0.57 3.57,0.57 0.55,0 1,0.45 1,1V20c0,0.55 -0.45,1 -1,1 -9.39,0 -17,-7.61 -17,-17 0,-0.55 0.45,-1 1,-1h3.5c0.55,0 1,0.45 1,1 0,1.25 0.2,2.45 0.57,3.57 0.11,0.35 0.03,0.74 -0.25,1.02l-2.2,2.2z"/></svg></div><div class="at-n">Telefone</div></div>
      <div class="at"><div class="at-i"><svg viewBox="0 0 24 24"><path d="M12,3v10.55c-0.59,-0.34 -1.27,-0.55 -2,-0.55 -2.21,0 -4,1.79 -4,4s1.79,4 4,4 4,-1.79 4,-4V7h4V3h-6z"/></svg></div><div class="at-n">Midia</div></div>
      <div class="at"><div class="at-i"><svg viewBox="0 0 24 24"><path d="M12,2C8.13,2 5,5.13 5,9c0,5.25 7,13 7,13s7,-7.75 7,-13c0,-3.87 -3.13,-7 -7,-7zM12,11.5c-1.38,0 -2.5,-1.12 -2.5,-2.5s1.12,-2.5 2.5,-2.5 2.5,1.12 2.5,2.5 -1.12,2.5 -2.5,2.5z"/></svg></div><div class="at-n">GPS</div></div>
      <div class="at"><div class="at-i"><svg viewBox="0 0 24 24"><path d="M4,4h6v6H4z M14,4h6v6h-6z M4,14h6v6H4z M14,14h6v6h-6z"/></svg></div><div class="at-n">APPS</div></div>
    </div>
  </div>
</div>
<div class="nota">V4 - Metalico Escuro</div>
</body></html>
