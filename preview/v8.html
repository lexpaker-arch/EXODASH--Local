<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>V8 - JARVIS Arc Reactor</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #000; font-family: Roboto; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
.screen { width: 900px; height: 520px; background: radial-gradient(ellipse at center, #0a1520 0%, #000 70%); border: 2px solid #00FFCC; border-radius: 6px; padding: 10px; position: relative; overflow: hidden; box-shadow: 0 0 60px rgba(0,255,204,0.2), inset 0 0 100px rgba(0,255,204,0.05); }
.moldura { width: 100%; height: 100%; border: 1px solid rgba(0,255,204,0.2); border-radius: 4px; padding: 14px; display: flex; flex-direction: column; }
.canto { position: absolute; width: 30px; height: 30px; }
.canto::before, .canto::after { content: ""; position: absolute; }
.canto::before { border: 2px solid #00FFCC; } .canto::after { border: 2px solid rgba(0,255,204,0.3); }
.canto-tl { top: -8px; left: -8px; } .canto-tl::before { top:0; left:0; width:30px; height:30px; border-right:none; border-bottom:none; } .canto-tl::after { top:4px; left:4px; width:22px; height:22px; border-right:none; border-bottom:none; }
.canto-tr { top: -8px; right: -8px; } .canto-tr::before { top:0; right:0; width:30px; height:30px; border-left:none; border-bottom:none; } .canto-tr::after { top:4px; right:4px; width:22px; height:22px; border-left:none; border-bottom:none; }
.canto-bl { bottom: -8px; left: -8px; } .canto-bl::before { bottom:0; left:0; width:30px; height:30px; border-right:none; border-top:none; } .canto-bl::after { bottom:4px; left:4px; width:22px; height:22px; border-right:none; border-top:none; }
.canto-br { bottom: -8px; right: -8px; } .canto-br::before { bottom:0; right:0; width:30px; height:30px; border-left:none; border-top:none; } .canto-br::after { bottom:4px; right:4px; width:22px; height:22px; border-left:none; border-top:none; }
.header { display: flex; justify-content: space-between; padding-bottom: 8px; }
.logo { color: #00FFCC; font-size: 18px; font-weight: bold; letter-spacing: 4px; text-shadow: 0 0 15px rgba(0,255,204,0.8); }
.by { color: #0a5a4a; font-size: 9px; letter-spacing: 3px; margin-top: 2px; }
.status { display: flex; gap: 14px; font-size: 10px; align-items: center; }
.st { color: #0a7a6a; } .ok { color: #00FFCC; text-shadow: 0 0 8px rgba(0,255,204,0.6); } .warn { color: #FFAA00; } .off { color: #FF3333; }
.cfg { width: 32px; height: 32px; border-radius: 50%; border: 1px solid #00FFCC; display: flex; align-items: center; justify-content: center; color: #00FFCC; font-size: 16px; margin-left: 8px; background: rgba(0,255,204,0.05); }
.div { height: 1px; background: linear-gradient(90deg, transparent, #00FFCC, transparent); opacity: 0.6; margin-bottom: 12px; }
.central { flex: 1; display: flex; gap: 12px; align-items: stretch; }
.tele { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 10px; }
.tel-linha { display: flex; justify-content: space-between; align-items: baseline; padding: 6px 0; border-bottom: 1px solid rgba(0,255,204,0.1); }
.tel-linha:last-child { border-bottom: none; }
.tel-label { color: #0a7a6a; font-size: 9px; letter-spacing: 2px; }
.tel-valor { color: #00FFCC; font-size: 16px; font-weight: bold; text-shadow: 0 0 12px rgba(0,255,204,0.8); font-variant-numeric: tabular-nums; }
.arc-area { display: flex; align-items: center; justify-content: center; position: relative; width: 200px; }
.arc-glow { position: absolute; width: 200px; height: 200px; border-radius: 50%; background: radial-gradient(circle, rgba(0,255,204,0.5) 0%, rgba(0,255,204,0.1) 40%, transparent 70%); animation: pulsa 3s ease-in-out infinite; }
@keyframes pulsa { 0%, 100% { opacity: 0.6; transform: scale(1); } 50% { opacity: 1; transform: scale(1.05); } }
.arc-anel-1 { position: absolute; width: 180px; height: 180px; border-radius: 50%; border: 2px dashed rgba(0,255,204,0.5); animation: gira 25s linear infinite; }
.arc-anel-2 { position: absolute; width: 150px; height: 150px; border-radius: 50%; border: 2px solid rgba(0,255,204,0.3); border-top-color: #00FFCC; border-bottom-color: #00FFCC; animation: gira-rev 15s linear infinite; }
@keyframes gira { to { transform: rotate(360deg); } }
@keyframes gira-rev { to { transform: rotate(-360deg); } }
.arc-btn { position: relative; width: 110px; height: 110px; border-radius: 50%; background: radial-gradient(circle, #0a3a3a 0%, #000 70%); border: 2px solid #00FFCC; display: flex; align-items: center; justify-content: center; color: #00FFCC; font-size: 16px; font-weight: bold; letter-spacing: 4px; box-shadow: 0 0 50px rgba(0,255,204,0.6), inset 0 0 30px rgba(0,255,204,0.3); }
.dir { flex: 1; display: flex; flex-direction: column; gap: 10px; justify-content: center; }
.rel-ring { width: 90px; height: 90px; border-radius: 50%; border: 1px solid rgba(0,255,204,0.4); display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 0 auto; background: rgba(0,255,204,0.03); box-shadow: 0 0 20px rgba(0,255,204,0.15); }
.rel-h { color: #E0FFF8; font-size: 22px; font-weight: 100; text-shadow: 0 0 10px rgba(0,255,204,0.5); }
.rel-l { width: 40px; height: 1px; background: rgba(0,255,204,0.4); margin: 3px 0; }
.rel-s { color: #00FFCC; font-size: 9px; }
.rel-d { color: #0a7a6a; font-size: 8px; letter-spacing: 3px; margin-top: 6px; text-align: center; text-transform: uppercase; }
.rel-dia { color: #00FFCC; font-size: 9px; text-align: center; text-shadow: 0 0 8px rgba(0,255,204,0.6); }
.mus { background: rgba(0,255,204,0.03); border: 1px solid rgba(0,255,204,0.2); border-radius: 8px; padding: 10px; }
.mus-l { color: #00FFCC; font-size: 7px; letter-spacing: 2px; text-shadow: 0 0 6px rgba(0,255,204,0.6); }
.mus-t { color: #E0FFF8; font-size: 10px; font-weight: bold; margin-top: 4px; }
.mus-a { color: #0a7a6a; font-size: 8px; }
.rodape { display: flex; justify-content: center; gap: 24px; padding-top: 12px; }
.at { display: flex; flex-direction: column; align-items: center; gap: 3px; }
.at-i { width: 46px; height: 46px; border-radius: 50%; border: 1px solid rgba(0,255,204,0.5); background: rgba(0,255,204,0.03); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 15px rgba(0,255,204,0.15); }
.at-i svg { width: 24px; height: 24px; } .at-i svg path { fill: #00FFCC; }
.at-n { color: #0a7a6a; font-size: 8px; }
.nota { position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%); color: #666; font-size: 11px; }
</style></head>
<body>
<div class="screen">
  <div class="moldura">
    <div class="canto canto-tl"></div><div class="canto canto-tr"></div><div class="canto canto-bl"></div><div class="canto canto-br"></div>
    <div class="header">
      <div><div class="logo">EXODASH</div><div class="by">BY ALEX. P</div></div>

      </div>
      <div class="arc-area">
        <div class="arc-glow"></div>

        <div class="arc-anel-2"></div>
        <div class="arc-btn">EXO</div>
      </div>
      <div class="dir">
        <div class="rel-ring"><div class="rel-h">14:32</div><div class="rel-l"></div><div class="rel-s">:47</div></div>
        <div class="rel-d">23 DE SETEMBRO</div>
        <div class="rel-dia">QUARTA-FEIRA</div>
        <div class="mus">
          <div class="mus-l">TOCANDO AGORA</div>
          <div class="mus-t">Bohemian Rhapsody</div>
          <div class="mus-a">Queen</div>
        </div>
      </div>
    </div>
    <div class="rodape">
      <div class="at"><div class="at-i"><svg viewBox="0 0 24 24"><path d="M6.62,10.79c1.44,2.83 3.76,5.14 6.59,6.59l2.2,-2.2c0.27,-0.27 0.67,-0.36 1.02,-0.24 1.12,0.37 2.33,0.57 3.57,0.57 0.55,0 1,0.45 1,1V20c0,0.55 -0.45,1 -1,1 -9.39,0 -17,-7.61 -17,-17 0,-0.55 0.45,-1 1,-1h3.5c0.55,0 1,0.45 1,1 0,1.25 0.2,2.45 0.57,3.57 0.11,0.35 0.03,0.74 -0.25,1.02l-2.2,2.2z"/></svg></div><div class="at-n">Telefone</div></div>
      <div class="at"><div class="at-i"><svg viewBox="0 0 24 24"><path d="M12,3v10.55c-0.59,-0.34 -1.27,-0.55 -2,-0.55 -2.21,0 -4,1.79 -4,4s1.79,4 4,4 4,-1.79 4,-4V7h4V3h-6z"/></svg></div><div class="at-n">Midia</div></div>
      <div class="at"><div class="at-i"><svg viewBox="0 0 24 24"><path d="M12,2C8.13,2 5,5.13 5,9c0,5.25 7,13 7,13s7,-7.75 7,-13c0,-3.87 -3.13,-7 -7,-7zM12,11.5c-1.38,0 -2.5,-1.12 -2.5,-2.5s1.12,-2.5 2.5,-2.5 2.5,1.12 2.5,2.5 -1.12,2.5 -2.5,2.5z"/></svg></div><div class="at-n">GPS</div></div>
      <div class="at"><div class="at-i"><svg viewBox="0 0 24 24"><path d="M4,4h6v6H4z M14,4h6v6h-6z M4,14h6v6H4z M14,14h6v6h-6z"/></svg></div><div class="at-n">APPS</div></div>
    </div>
  </div>
</div>
