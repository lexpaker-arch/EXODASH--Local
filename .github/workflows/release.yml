name: Build and Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Criar secrets.properties
        run: echo "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}" > secrets.properties

      - name: Restaurar keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > exodash.keystore
          ls -la exodash.keystore

      - name: Build APK assinado
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$PWD/exodash.keystore \
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

      - name: Renomear APK
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          if [ "$VERSION" = "$GITHUB_REF" ]; then
            VERSION="manual-$(date +%Y%m%d-%H%M)"
          fi
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk release/EXODASH-${VERSION}.apk
          ls -lh release/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: EXODASH-APK
          path: release/*.apk

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
